[project]
name = "calibration-drift"
version = "0.1.0"
description = "Spatio-temporal sensor calibration drift detection for LiDAR/Camera/Radar suites."
requires-python = ">=3.10"
authors = [{ name = "Prabal Bijoy Dutta" }]
dependencies = [
    "numpy",
    "opencv-python-headless",
    "open3d",
    "nuscenes-devkit",
    "pyyaml",
    "mlflow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "jupyter",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
